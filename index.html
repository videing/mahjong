<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>四人麻将 · 联机</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0a120e; overflow: hidden;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #rotate {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #0b1410; color: #f2b179; z-index: 10;
    font-size: 20px; font-weight: 700; text-align: center; line-height: 1.8;
  }
  #rotate span { font-size: 13px; color: #9b968b; font-weight: 400; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rotate">📱 请横屏使用<span>把手机横过来，牌桌会自动摆好</span></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
